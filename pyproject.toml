[project]
name = "tinymap"
version = "0.1.0"
description = "Isometric pixel-art city maps (tiny.london style) generated on your own GPUs"
requires-python = ">=3.10"
dependencies = [
  "pyyaml", "numpy", "pillow", "pyvips",
  "torch>=2.4", "diffusers>=0.36", "transformers>=4.51", "accelerate", "peft>=0.17",
  "bitsandbytes>=0.45", "safetensors", "sentencepiece",
]

[project.scripts]
tinymap = "tinymap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinymap"]
